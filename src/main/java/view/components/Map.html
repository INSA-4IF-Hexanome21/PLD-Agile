<link rel="stylesheet" href="/css/sidebar.css">

<div id="map" style="height: 600px; width: 100%;"></div>

<div id="deliverer">
  <h3 class="control-title">Assigner les livreurs</h3>
  <form>
    <div>
      <label for="nbLivreur">Nombre de livreur</label>
      <input type="number" id="nbLivreur" name="nbLivreur" min="1" max="20" value="1" />
      <span class="validity"></span>
    </div>
    <div>
      <input id="btn_nbLivreur" type="submit" value="Envoyer" />
    </div>
  </form>

  <div class="column">
    <div class="dragElement" draggable="true">
      <h3>Livraison à assigner</h3>
    </div>
    <div class="dropZone"></div>
    <div class="dropZone"></div>
  </div>
</div>

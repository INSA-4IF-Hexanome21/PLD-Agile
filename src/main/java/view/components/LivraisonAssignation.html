<!-- components/LivraisonAssignation.html -->
<link rel="stylesheet" href="/css/livraison.css">

<div id="livraison-container">
  <h3 class="control-title">Assigner les livreurs</h3>

  <form id="form-livreurs">
    <label for="nbLivreur">Nombre de livreurs</label>
    <input type="number" id="nbLivreur" name="nbLivreur" min="1" max="10" value="3">
    <button type="button" id="btn_nbLivreur">Créer</button>
  </form>

  <div id="livreurs"></div>

  <div class="column">
    <div class="dragElement" draggable="true">
      <h3>Livraison à assigner</h3>
    </div>
  </div>
</div>
